[package]
name = "iamwriter"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14", features = ["advanced"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[patch.crates-io]
iced_graphics = { path = "vendor/iced_graphics" }
winit = { path = "vendor/winit" }

# 의존성 디버그 정보 제거: debug 빌드 용량 감소
[profile.dev.package."*"]
debug = false
