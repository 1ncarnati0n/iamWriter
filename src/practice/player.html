<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>iamWriter 플레이어</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #1a1b26; color: #c0caf5; font: 15px -apple-system, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  #wrap { flex: 1; position: relative; min-height: 200px; }
  body.watch #wrap { flex: 0 0 auto; height: 56vh; }
  #p { position: absolute; inset: 0; width: 100%; height: 100%; }
  #bar { padding: 10px 16px; display: flex; gap: 12px; align-items: center; border-top: 1px solid #292e42; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: #565f89; flex: none; }
  #dot.on { background: #9ece6a; }
  #msg { color: #737aa2; }
  #gate { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column;
          gap: 14px; background: rgba(26, 27, 38, .92); z-index: 2; }
  #gate button { font: inherit; font-size: 18px; padding: 14px 32px; border: 0; border-radius: 10px;
                 background: #7aa2f7; color: #1a1b26; cursor: pointer; }
  #gate p { margin: 0; color: #737aa2; }

  /* 영상 보기: 지금 문장 + 전체 문장 */
  #study { display: none; flex: 1; min-height: 0; flex-direction: column; border-top: 1px solid #292e42; }
  body.watch #study { display: flex; }
  #now { padding: 16px 24px 10px; min-height: 92px; }
  #now .en { font-size: 24px; line-height: 1.35; color: #c0caf5; }
  #now .ko { font-size: 16px; line-height: 1.5; color: #9aa5ce; margin-top: 6px; }
  #tools { display: flex; gap: 6px; align-items: center; padding: 0 24px 10px; flex-wrap: wrap; }
  #tools button { font: inherit; font-size: 13px; padding: 4px 12px; border: 1px solid #3b4261; border-radius: 14px;
                  background: transparent; color: #a9b1d6; cursor: pointer; }
  #tools button.on { background: #7aa2f7; border-color: #7aa2f7; color: #1a1b26; }
  #tools .hint { color: #737aa2; font-size: 12px; margin-left: auto; }
  #list { flex: 1; overflow-y: auto; padding: 4px 16px 24px; }
  .line { padding: 7px 10px; border-radius: 8px; cursor: pointer; display: grid; grid-template-columns: 52px 1fr; gap: 2px 10px; }
  .line:hover { background: #24283b; }
  .line.cur { background: #292e42; }
  .line .t { color: #565f89; font-size: 12px; font-variant-numeric: tabular-nums; padding-top: 3px; }
  .line .en { color: #a9b1d6; }
  .line.cur .en { color: #c0caf5; }
  .line .ko { grid-column: 2; color: #737aa2; font-size: 13px; }
  .line .ko.wait { font-style: italic; color: #3b4261; }
  body.no-en .en { visibility: hidden; }
  body.no-ko .ko { display: none; }
</style>
</head>
<body>
<div id="wrap">
  <div id="p"></div>
  <div id="gate">
    <button id="go">▶ 클릭해서 연결</button>
    <p>브라우저 자동재생 제한 때문에 처음 한 번만 눌러 주세요.</p>
  </div>
</div>
<div id="study">
  <div id="now"><div class="en"></div><div class="ko"></div></div>
  <div id="tools">
    <button id="t-en" class="on">영어</button>
    <button id="t-ko" class="on">한국어</button>
    <button id="t-slow">0.75×</button>
    <button id="t-stop">문장마다 멈춤</button>
    <span class="hint">Space 재생/멈춤 · ←→ 문장 이동 · R 다시 듣기 · K 한국어</span>
  </div>
  <div id="list"></div>
</div>
<div id="bar"><span id="dot"></span><span id="msg">연결 대기 중…</span></div>
<script>
  let player = null, ready = false, unlocked = false, seq = -1, cur = null, pending = null;
  // 따라치기: 지금 구간. armed: 재생 위치가 실제로 구간 안에 들어온 뒤에만 끝에서 멈춘다 (seek 직전의 옛 위치로 오작동 방지)
  let seg = null, armed = false, rate = 1;
  // 보기: 모드, 자막, 지금 문장 번호
  let mode = 'segment', subs = [], subsVer = -1, now = -1;
  const opt = JSON.parse(localStorage.getItem('iamwriter-watch') || '{"en":true,"ko":true,"slow":false,"stop":false}');
  const $ = (id) => document.getElementById(id);
  const msg = (t) => $('msg').textContent = t;
  const fmt = (t) => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');

  window.onYouTubeIframeAPIReady = () => {
    player = new YT.Player('p', {
      width: '100%', height: '100%',
      playerVars: { playsinline: 1, rel: 0, modestbranding: 1, cc_load_policy: 0, origin: location.origin },
      events: {
        onReady: () => { ready = true; msg('준비됨'); flush(); },
        onStateChange: (e) => { if (e.data === YT.PlayerState.PLAYING) player.setPlaybackRate(rate); },
        onError: (e) => msg([101, 150, 153].includes(e.data)
          ? '이 영상은 다른 사이트에서 재생(임베드)이 막혀 있습니다. 다른 영상을 써 주세요.'
          : '재생 오류 (' + e.data + ')'),
      },
    });
  };
  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);

  $('go').onclick = () => {
    unlocked = true;
    $('gate').remove();
    $('dot').classList.add('on');
    flush();
  };

  function flush() {
    if (!ready || !unlocked || !pending) return;
    const c = pending; pending = null;
    mode = c.mode || 'segment';
    document.body.classList.toggle('watch', mode === 'watch');
    if (mode === 'watch') {
      seg = null;
      rate = opt.slow ? 0.75 : 1;
      player.setPlaybackRate(rate);
      if (c.id !== cur) { cur = c.id; player.loadVideoById({ videoId: c.id, startSeconds: 0 }); }
      else player.playVideo();
      msg('영상 보기 — 문장을 누르면 그 자리로 갑니다');
      return;
    }
    seg = { start: c.start, end: c.end };
    armed = false;
    rate = c.rate || 1;
    player.setPlaybackRate(rate);
    if (c.id !== cur) {
      cur = c.id;
      player.loadVideoById({ videoId: c.id, startSeconds: c.start });
    } else {
      player.seekTo(c.start, true);
      player.playVideo();
    }
    msg('재생 중 ' + fmt(c.start) + ' – ' + fmt(c.end));
  }

  setInterval(async () => {
    try {
      const c = await (await fetch('/cmd', { cache: 'no-store' })).json();
      if (c.seq !== seq && c.seq > 0) { seq = c.seq; pending = c; flush(); }
      if (c.subs_ver !== subsVer) {
        subsVer = c.subs_ver;
        subs = await (await fetch('/subs', { cache: 'no-store' })).json();
        renderList();
      }
    } catch (_) { msg('앱과 연결이 끊어졌습니다. 앱을 다시 켜고 플레이어를 다시 여세요.'); }
  }, 200);

  // ---- 영상 보기 ----
  function renderList() {
    const list = $('list');
    list.innerHTML = '';
    subs.forEach((l, i) => {
      const d = document.createElement('div');
      d.className = 'line';
      d.innerHTML = '<span class="t"></span><span class="en"></span><span class="ko"></span>';
      d.children[0].textContent = fmt(l.start);
      d.children[1].textContent = l.en;
      d.children[2].textContent = l.ko || '번역 준비 중…';
      if (!l.ko) d.children[2].classList.add('wait');
      d.onclick = () => jump(i);
      list.appendChild(d);
    });
    now = -1;
  }
  const lineAt = (t) => {
    let i = -1;
    for (let k = 0; k < subs.length; k++) { if (subs[k].start <= t + 0.05) i = k; else break; }
    return i;
  };
  function show(i) {
    if (i === now) return;
    const rows = $('list').children;
    if (rows[now]) rows[now].classList.remove('cur');
    now = i;
    const l = subs[i];
    $('now').children[0].textContent = l ? l.en : '';
    $('now').children[1].textContent = l ? (l.ko || '') : '';
    if (rows[i]) { rows[i].classList.add('cur'); rows[i].scrollIntoView({ block: 'center', behavior: 'smooth' }); }
  }
  function jump(i) {
    if (!subs[i] || !player) return;
    pausedFor = -1;
    player.seekTo(subs[i].start, true);
    player.playVideo();
    show(i);
  }
  // 문장마다 멈춤: 지금 문장 끝에서 한 번 멈춘다. pausedFor = 이미 멈춘 문장(다시 재생하면 그냥 넘어간다)
  let pausedFor = -1;
  function save() { localStorage.setItem('iamwriter-watch', JSON.stringify(opt)); }
  function paintTools() {
    $('t-en').classList.toggle('on', opt.en);
    $('t-ko').classList.toggle('on', opt.ko);
    $('t-slow').classList.toggle('on', opt.slow);
    $('t-stop').classList.toggle('on', opt.stop);
    document.body.classList.toggle('no-en', !opt.en);
    document.body.classList.toggle('no-ko', !opt.ko);
  }
  const flip = (k) => () => {
    opt[k] = !opt[k]; save(); paintTools();
    if (k === 'slow' && mode === 'watch' && player) { rate = opt.slow ? 0.75 : 1; player.setPlaybackRate(rate); }
    if (k === 'stop') pausedFor = now;
  };
  $('t-en').onclick = flip('en');
  $('t-ko').onclick = flip('ko');
  $('t-slow').onclick = flip('slow');
  $('t-stop').onclick = flip('stop');
  paintTools();

  document.addEventListener('keydown', (e) => {
    if (mode !== 'watch' || !player) return;
    if (e.code === 'Space') {
      e.preventDefault();
      player.getPlayerState() === YT.PlayerState.PLAYING ? player.pauseVideo() : player.playVideo();
    } else if (e.key === 'ArrowLeft') { e.preventDefault(); jump(Math.max(0, now - 1)); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); jump(Math.min(subs.length - 1, now + 1)); }
    else if (e.key === 'r' || e.key === 'R') jump(Math.max(0, now));
    else if (e.key === 'k' || e.key === 'K') flip('ko')();
  });

  setInterval(() => {
    if (!player || !player.getCurrentTime) return;
    const t = player.getCurrentTime();
    if (mode === 'watch') {
      const l = subs[now];
      if (opt.stop && l && pausedFor !== now && t >= l.end - 0.1 && t < l.end + 1) {
        player.pauseVideo();
        pausedFor = now;
        msg('멈춤 — 따라 말해 보고 Space');
        return;
      }
      const i = lineAt(t);
      if (i >= 0) show(i);
      return;
    }
    // 따라치기: 문장 끝에서 멈춤
    if (!seg) return;
    if (!armed && t >= seg.start - 0.5 && t < seg.end) armed = true;
    if (armed && t >= seg.end) {
      player.pauseVideo();
      seg = null;
      msg('멈춤 — 앱에서 따라 치세요');
    }
  }, 50);
</script>
</body>
</html>
